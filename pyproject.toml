[project]
name = "svc-c2-019"
version = "0.1.0"
description = "HR Onboarding Process Orchestration Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by the build environment and installed from a package registry.
# Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# The published wheel ships no py.typed marker, so mypy resolves AgentBaseGraph,
# FunctionNode and friends to Any. Under strict that surfaces as "cannot subclass
# ... (has type Any)" on exactly the inheritance the framework requires. Stating
# that fact once here is more honest than scattering per-class ignores.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# These distributions do not ship type information yet. This declares the
# dependency as untyped -- it does not disable any check on our own code.
# Remove this section and re-measure once the wheel ships py.typed.
module = ["framework.*", "shared.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true

